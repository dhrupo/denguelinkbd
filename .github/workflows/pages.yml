name: Build and publish the daily page

on:
  schedule:
    # 13:30 in Dhaka: after the Met Department has posted the day's forecast (around noon).
    - cron: "30 7 * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    env:
      TZ: Asia/Dhaka
      # Nobody is waiting on this build, so slow government servers get three minutes instead of thirty seconds.
      DENGUE_LINK_SOURCE_BUDGET: "180"
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5

      - name: Install
        run: uv sync --frozen

      - name: Run the tests
        if: github.event_name != 'schedule'
        run: uv run pytest -q

      # Past daily reports and mosquito surveys drop off their source pages, so each build carries forward what earlier ones collected.
      - name: Bring back what earlier builds collected
        uses: actions/cache@v4
        with:
          path: |
            data/dengue_link.db
            data/cache
          key: collected-${{ github.run_id }}
          restore-keys: collected-

      # From GitHub's machines the link to Bangladesh's government servers drops out for a few minutes at a time.
      # So a build with a missing source is tried again, up to three times, and the attempt with the fewest gaps is published.
      # If no attempt has a forecast (DGHS unreachable throughout), the step fails and the last good page stays online.
      - name: Build today's page
        run: |
          fewest=99
          for attempt in 1 2 3; do
            uv run python -m dengue_link 2> attempt.log || true
            cat attempt.log >&2
            missing=$(grep -c '^FAILED' attempt.log || true)
            if grep -q 'id="data"' out/map.html && [ "$missing" -lt "$fewest" ]; then
              fewest=$missing
              cp out/map.html best.html
            fi
            if [ "$missing" -eq 0 ] || [ "$attempt" -eq 3 ]; then break; fi
            echo "Attempt $attempt missed $missing source(s); trying again in two minutes."
            sleep 120
          done
          test -f best.html
          mkdir site && cp best.html site/index.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4

      # Vercel serves a copy of the finished page. It only rebuilds when told to, so the daily job tells it, if a hook has been set.
      - name: Tell Vercel there is a new page
        if: env.VERCEL_DEPLOY_HOOK != ''
        run: curl -fsS -X POST "$VERCEL_DEPLOY_HOOK"
